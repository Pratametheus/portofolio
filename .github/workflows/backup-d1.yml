name: Backup D1

on:
  schedule:
    # Every Monday at 03:00 UTC — no particular reason for the day/time beyond
    # "regularly, and not during a likely deploy window".
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export production D1 database
        run: npx wrangler d1 export portofolio-admin --remote --output=portofolio-admin-backup.sql -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: portofolio-admin-backup-${{ github.run_id }}
          path: portofolio-admin-backup.sql
          retention-days: 90
