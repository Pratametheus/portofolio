name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cf:typegen
      - run: npm run cf:check
      - run: npm run check:size
      - run: npx tsc --noEmit
      - run: npx wrangler d1 migrations apply portofolio-admin --local
      - run: npx wrangler d1 execute portofolio-admin --local --file=scripts/seed-initial-content.sql
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run build
      # Accessibility is asserted as an error (must be 100). Performance / SEO /
      # LCP report as warnings until the thresholds are tuned against real CI
      # runs; flip them to "error" in lighthouserc.json once the numbers settle.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true

  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
